name = "oukami-diabo"
pages_build_output_dir = "public"
compatibility_date = "2026-08-01"

# Variable non sensible, chargée automatiquement dans env.SUPER_ADMIN_SESSION_VERSION.
# Incrémentez cette valeur après chaque changement du mot de passe Super Admin
# afin d'invalider toutes les sessions précédentes.
[vars]
SUPER_ADMIN_SESSION_VERSION = "1"
SUPER_ADMIN_LOGIN = "mega@services.local"

# SUPER_ADMIN_LOGIN n’est pas sensible. Le mot de passe Super Admin reste exclusivement
# un secret chiffré Cloudflare : SUPER_ADMIN_PASSWORD (ne jamais le publier dans le dépôt).

[[d1_databases]]
binding = "DB"
database_name = "oukami_d1"
database_id = "001c173e-694b-434d-a8fc-8c5fa2351438"

[[kv_namespaces]]
binding = "KV"
id = "25eac34d165240bfbd8c1bcd14c2954d"
